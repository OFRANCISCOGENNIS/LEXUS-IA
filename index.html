<!DOCTYPE html>
<html lang="pt-BR" data-theme="light" data-accent="violet">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#141416" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="NEXUS" />
  <title>NEXUS — Workspace 100% local</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%97%86%3C/text%3E%3C/svg%3E" />
  <!-- Tipografia do redesign: Manrope (UI) + Lora (prosa) — auto-hospedadas, 100% local -->
  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/shell.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/editor.css" />
  <link rel="stylesheet" href="css/database.css" />
  <link rel="stylesheet" href="css/views.css" />
  <link rel="stylesheet" href="css/productivity.css" />
  <link rel="stylesheet" href="css/polish.css" />
  <link rel="stylesheet" href="css/redesign.css" />
  <link rel="stylesheet" href="css/mobile.css" />
  <link rel="stylesheet" href="css/print.css" media="print" />
</head>
<body>
  <div id="app" class="app">
    <!-- ══════════ Sidebar ══════════ -->
    <aside id="sidebar" class="sidebar" aria-label="Navegação">
      <div class="sidebar-head">
        <button id="ws-switcher" class="ws-switcher" title="Workspace">
          <span class="ws-logo-block">N</span>
          <span class="ws-name">NEXUS</span>
        </button>
        <span class="ws-local-pill" title="100% local">local</span>
        <button id="sidebar-collapse" class="icon-btn" title="Recolher sidebar (⌘\)" aria-label="Recolher sidebar">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>

      <!-- corpo único: a roda do mouse rola a barra inteira, em qualquer ponto -->
      <div class="sidebar-body">
      <div class="sidebar-actions">
        <button class="sidebar-search" data-action="open-palette" aria-label="Buscar">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="20" y1="20" x2="16.5" y2="16.5"/></svg>
          <span class="ss-label">Buscar…</span>
          <kbd class="ss-kbd">⌘K</kbd>
        </button>
        <button class="sidebar-item" data-nav="home">
          <span class="si-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/></svg></span><span class="si-label">Início</span>
        </button>
        <button class="sidebar-item" data-nav="daily">
          <span class="si-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg></span><span class="si-label">Nota diária</span>
        </button>
        <button class="sidebar-item" data-nav="tasks">
          <span class="si-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="m8.5 12.2 2.4 2.4 4.8-5"/></svg></span><span class="si-label">Tarefas</span>
          <span class="si-badge" id="nav-tasks-badge" hidden>0</span>
        </button>
        <button class="sidebar-item" data-nav="calendar">
          <span class="si-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="16" rx="3"/><path d="M3.5 10h17M8 2.5V6M16 2.5V6"/></svg></span><span class="si-label">Calendário</span>
        </button>
        <button class="sidebar-item" data-nav="productivity">
          <span class="si-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg></span><span class="si-label">Produtividade</span>
        </button>
        <button class="sidebar-item" data-nav="tags">
          <span class="si-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5V4h7.5L21 14.5 13.5 22 3 11.5Z"/><circle cx="8" cy="9" r="1.4"/></svg></span><span class="si-label">Tags</span>
        </button>
        <button class="sidebar-item" data-nav="graph">
          <span class="si-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="8" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M8.2 7 15.6 8M7 8.2l4 7.6M16.8 10l-3.6 6"/></svg></span><span class="si-label">Grafo</span>
        </button>
      </div>

      <div class="sidebar-scroll">
        <section class="sidebar-section" id="section-favorites" hidden>
          <button class="section-title" data-toggle-section="favorites">
            <span class="section-chevron">▸</span> Favoritos
          </button>
          <div class="section-body" id="favorites-list"></div>
        </section>

        <section class="sidebar-section" id="section-pages">
          <button class="section-title" data-toggle-section="pages">
            <span class="section-chevron">▸</span> Páginas
          </button>
          <div class="section-body" id="pages-tree"></div>
          <button class="sidebar-item sidebar-add" data-action="new-page">
            <span class="si-icon">＋</span><span class="si-label">Nova página</span>
          </button>
        </section>

        <section class="sidebar-section" id="section-dbs">
          <button class="section-title" data-toggle-section="dbs">
            <span class="section-chevron">▸</span> Databases
          </button>
          <div class="section-body" id="dbs-list"></div>
          <button class="sidebar-item sidebar-add" data-action="new-database">
            <span class="si-icon">＋</span><span class="si-label">Nova database</span>
          </button>
        </section>
      </div>

      <div class="sidebar-foot">
        <button class="sidebar-item" data-nav="templates">
          <span class="si-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="3.5" width="17" height="17" rx="3"/><path d="M3.5 9h17M9.5 9v11.5"/></svg></span><span class="si-label">Templates</span>
        </button>
        <button class="sidebar-item" data-nav="trash">
          <span class="si-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M6 7l1 13h10l1-13M10 7V4h4v3M10 11v6M14 11v6"/></svg></span><span class="si-label">Lixeira</span>
        </button>
        <button class="sidebar-item" data-nav="settings">
          <span class="si-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/></svg></span><span class="si-label">Configurações</span>
        </button>
        <button type="button" id="sidebar-sync-badge" class="local-badge" data-action="open-sync-settings">
          🔒 100% local — seus dados nunca saem do dispositivo
        </button>
      </div>
      </div><!-- /.sidebar-body -->
    </aside>

    <!-- ══════════ Main ══════════ -->
    <div class="main-wrap">
      <header id="topbar" class="topbar">
        <div class="topbar-left">
          <button id="drawer-toggle" class="icon-btn mobile-only" title="Menu" aria-label="Abrir menu">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M3 5h12M3 9h12M3 13h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          </button>
          <button id="sidebar-expand" class="icon-btn" title="Expandir sidebar" hidden aria-label="Expandir sidebar">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <nav id="breadcrumb" class="breadcrumb" aria-label="Caminho"></nav>
        </div>
        <div class="topbar-right" id="topbar-actions"></div>
        <div class="topbar-global">
          <button class="capture-cta" data-action="quick-capture" title="Captura rápida (⌘⇧N)">
            ＋ Captura rápida <kbd>⌘⇧N</kbd>
          </button>
          <button id="theme-toggle" class="theme-toggle" title="Alternar tema (⌘⇧L)" aria-label="Alternar tema">🌙</button>
          <span class="topbar-avatar" id="topbar-avatar" title="NEXUS · workspace local">N</span>
        </div>
      </header>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
    <div id="drawer-scrim" class="drawer-scrim"></div>

    <!-- ══════════ Barra de navegação inferior (mobile) ══════════ -->
    <nav id="mobile-tabbar" class="mobile-tabbar mobile-only" aria-label="Navegação inferior">
      <button class="mtab" data-nav="home" aria-label="Início">
        <span class="mtab-icon">⌂</span><span class="mtab-label">Início</span>
      </button>
      <button class="mtab" data-action="open-palette" aria-label="Buscar">
        <span class="mtab-icon">⌕</span><span class="mtab-label">Buscar</span>
      </button>
      <button class="mtab" data-nav="tasks" aria-label="Tarefas">
        <span class="mtab-icon">✓</span><span class="mtab-label">Tarefas</span>
      </button>
      <button class="mtab" data-nav="daily" aria-label="Diário">
        <span class="mtab-icon">☀</span><span class="mtab-label">Diário</span>
      </button>
      <button class="mtab" id="mtab-menu" aria-label="Menu">
        <span class="mtab-icon">☰</span><span class="mtab-label">Menu</span>
      </button>
    </nav>
    <button id="mobile-fab" class="mobile-fab mobile-only" aria-label="Nova página" data-action="new-page">＋</button>
  </div>

  <!-- Overlays raiz (palette, modais, toasts, menus) -->
  <div id="overlay-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
  <script>
    // PWA: registra o service worker (offline / instalável). Só em contexto seguro.
    if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
      addEventListener("load", async () => {
        try {
          // updateViaCache:"none" → o próprio sw.js nunca vem do cache HTTP
          const reg = await navigator.serviceWorker.register("sw.js", { updateViaCache: "none" });
          reg.update().catch(() => {});
          // versão nova encontrada → ativa na hora e recarrega uma única vez
          reg.addEventListener("updatefound", () => {
            const sw = reg.installing;
            if (!sw) return;
            sw.addEventListener("statechange", () => {
              if (sw.state === "installed" && navigator.serviceWorker.controller) sw.postMessage("skip-waiting");
            });
          });
          let reloaded = false;
          navigator.serviceWorker.addEventListener("controllerchange", () => {
            if (reloaded) return;
            reloaded = true;
            location.reload();
          });
        } catch {}
      });
    }
  </script>
</body>
</html>
